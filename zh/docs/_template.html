<!doctype html>
<!-- The template of every Chinese docs page. The pages beside it are built
     from the app repository's docs/zh-Hans/ by `make docs-site` (docs-kit,
     #334): change a page there, never here. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} — NetworkMonitor 文档</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
{{alternates}}
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="{{root}}assets/favicon-32.png?v=2dd491c8">
<link rel="icon" type="image/png" sizes="64x64" href="{{root}}assets/favicon-64.png?v=b60dbd4d">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png?v=9bc3e2d1">
<link rel="stylesheet" href="{{root}}assets/docs.css">
<script>
// The language chosen with a switch is kept, as on the home page (#430).
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[data-lang]');
  if (a) try { localStorage.setItem('lang', a.getAttribute('data-lang')); } catch (err) {}
});
</script>
</head>
<body>
<a class="skip" href="#content">跳到正文</a>
<nav class="nav" aria-label="NetworkMonitor">
  <div class="wrap">
    <a class="brand" href="{{root}}zh/"><img src="{{root}}assets/favicon-64.png?v=b60dbd4d" alt="" width="24" height="24">NetworkMonitor</a>
    <div class="nav-links">
      <a href="{{root}}zh/docs/" aria-current="true">文档</a>
      {{switch}}
    </div>
    <a class="pill" href="https://github.com/kevinabouhanna/NetworkMonitor/releases/latest/download/NetworkMonitor.dmg">下载</a>
  </div>
</nav>

<div class="docs wrap">
  <details class="docs-menu" open>
    <summary>所有页面</summary>
    <nav aria-label="文档">{{nav}}</nav>
  </details>
  <main class="page" id="content">
{{content}}
    <p class="page-source">本页来自 <a href="{{source}}">GitHub 上的文档</a>，版本 <a href="{{commit_url}}"><code>{{commit}}</code></a>。想提出修改，请<a href="https://github.com/kevinabouhanna/NetworkMonitor/issues">提交问题</a>。</p>
  </main>
</div>
<script>
// 窄屏上，页面列表默认收起，放在正文上方。
if (matchMedia('(max-width: 834px)').matches) document.querySelector('.docs-menu').removeAttribute('open');
</script>

<footer>
  <div class="wrap">
    <div class="row">
      <span>© 2026 Kevin Abou Hanna。NetworkMonitor 是采用 Apache 2.0 许可证的自由软件。macOS 是 Apple Inc. 的商标。</span>
      <nav aria-label="项目链接">
        <a href="https://github.com/kevinabouhanna/NetworkMonitor">GitHub</a>
        <a href="https://github.com/kevinabouhanna/NetworkMonitor/releases">版本发布</a>
        <a href="https://github.com/kevinabouhanna/NetworkMonitor/issues">报告问题</a>
        <a href="https://github.com/kevinabouhanna/NetworkMonitor/blob/main/LICENSE">许可证</a>
      </nav>
    </div>
  </div>
</footer>
</body>
</html>
