name: Assets

# Every image, GIF and video the site uses is listed in shots/shots.json, with
# the windows it shows or why it shows none, so a change to the app can't leave
# it stale unnoticed (#413). The check is main's site-shots, reading files only.
on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-check:
    runs-on: macos-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out the app, for the check and the README's list
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Build the check
        run: |
          swiftc -O -parse-as-library app/Scripts/site-shots.swift \
            app/Sources/NetworkMonitorCore/AccessibilityAudit.swift -o site-shots

      - name: Check every picture, GIF and video is listed
        run: ./site-shots coverage --site . --repo app
