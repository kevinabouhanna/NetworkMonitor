name: Assets

# Every image, GIF and video the site uses is listed in shots/shots.json, with
# the windows it shows or why it shows none, so a change to the app can't leave
# it stale unnoticed (#413). The check is main's site-shots, reading files only.
on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-check:
    runs-on: macos-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # main, or for a change to both branches, main's branch this one is
      # named after: scanner-425 for scanner-425-site. Each pull request is
      # then checked against the other (#426,
      # docs/development.md#changing-both-branches on main).
      - name: Find the app's branch
        id: app
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          ref=main
          if [[ "$HEAD" == *-site ]] && git ls-remote --exit-code --heads origin "${HEAD%-site}" >/dev/null; then
            ref="${HEAD%-site}"
          fi
          echo "The app from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the app, for the check and the README's list
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.app.outputs.ref }}
          path: app

      - name: Build the check
        run: |
          swiftc -O -parse-as-library app/Scripts/site-shots.swift \
            app/Sources/NetworkMonitorCore/AccessibilityAudit.swift -o site-shots

      - name: Check every picture, GIF and video is listed
        run: ./site-shots coverage --site . --repo app
