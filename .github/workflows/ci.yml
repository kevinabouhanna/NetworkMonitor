name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests only: the token needs nothing beyond reading the code (#400),
# and a pull request's description, for the translation check (#434).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS is required, not a preference: the app links AppKit and SwiftUI.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # bundle.sh derives the build number from the commit count, which a
          # depth-1 clone would report as 1.
          fetch-depth: 0

      # An English page for people using the app changes with its translation
      # in each language, or the description says why not: a line
      # "No translation needed: <why>" (#434). The description is read as it
      # runs, so re-running the job picks up a line added since. Files only,
      # so first.
      - name: Check each changed English page's translations changed too
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: make translation-check BASE=origin/${{ github.base_ref }}

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Not `swift test`: neither XCTest nor swift-testing ships with Command
      # Line Tools, so the suite is a plain executable. See Package.swift.
      # GitHub sets CI=true, which skips the tests that need live network
      # traffic — a sandboxed runner cannot provide it.
      - name: Test
        run: make test

      # Every image, GIF and video the site, the README and the docs use must
      # be listed with the window it shows, so none goes stale unnoticed (#413).
      # Reads files only: no app. The site is gh-pages, or a branch named after
      # this one with -site, for a change to both branches: each pull request
      # is then checked against the other (#426,
      # docs/development.md#changing-both-branches).
      - name: Find the website's branch
        id: site
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          ref=gh-pages
          if [[ -n "$HEAD" ]] && git ls-remote --exit-code --heads origin "$HEAD-site" >/dev/null; then
            ref="$HEAD-site"
          fi
          echo "The website from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the website
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.site.outputs.ref }}
          path: site

      - name: Check every picture, GIF and video is listed
        run: make asset-check SITE=site

      # The bundle is where breakage actually hides: Info.plist keys, the
      # .icns, codesigning. `swift build` alone would not catch any of it.
      - name: Assemble the app bundle
        run: make app

      - name: Check the bundle is well formed
        run: |
          codesign --verify --verbose=1 build/NetworkMonitor.app
          test -f build/NetworkMonitor.app/Contents/Info.plist
          test -f build/NetworkMonitor.app/Contents/Resources/AppIcon.icns
          test -f build/NetworkMonitor.app/Contents/Resources/Geo/countries.bin
          test -f build/NetworkMonitor.app/Contents/Resources/Geo/owners.bin
          test -f build/NetworkMonitor.app/Contents/Resources/Geo/world.bin
          test -f build/NetworkMonitor.app/Contents/Resources/Geo/README.md
          test -x build/NetworkMonitor.app/Contents/MacOS/NetworkMonitor

      # Everything above proves the app compiles and is packaged correctly, and
      # none of it would notice a crash on launch — the one failure that an
      # auto-updater would happily ship to every user, and that leaves them with
      # no working copy to receive the fix with.
      - name: Smoke test — the app launches and stays up
        run: ./Scripts/smoke-test.sh

  universal:
    # Releases ship arm64 + x86_64. Runs alongside the job above rather than
    # after it, so the slower two-architecture compile does not delay feedback.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build both architectures
        run: make universal

      - name: Check both slices are present
        run: |
          archs=$(lipo -archs build/NetworkMonitor.app/Contents/MacOS/NetworkMonitor)
          echo "built: $archs"
          case "$archs" in
            *arm64*) ;; *) echo "missing arm64" >&2; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;; *) echo "missing x86_64" >&2; exit 1 ;;
          esac
