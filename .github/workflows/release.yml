name: Release

# Cut a release by tagging:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # required to create the release and upload the disk image

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Not shallow: bundle.sh derives the build number from the commit
          # count, and the default depth-1 clone would make every release
          # build number 1 — which is exactly the value an updater uses to
          # decide whether a new version exists.
          fetch-depth: 0

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tagged commit that fails its tests should not become a release.
      - name: Test
        run: make test

      # Universal, unlike CI's native build: a release has to run on Intel too.
      # `make dmg` builds the universal app, with its privileged helper inside,
      # also universal, and packages it as the drag-to-Applications disk image
      # the website's Download buttons point at.
      #
      # Signed with the Developer ID and notarized (#119): the app first, so
      # it's stapled before it's packaged, then the disk image. Either one opens
      # without a warning, even offline. A release without them would ask for
      # Open Anyway again, so a missing secret fails the build rather than
      # shipping that.
      - name: Build, sign, notarize and package
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.value }}
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          for name in DEVID_P12_BASE64 DEVID_P12_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER; do
            test -n "${!name}" || { echo "$name is not set" >&2; exit 1; }
          done
          export DEVID_P12="$RUNNER_TEMP/developer-id.p12" NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$DEVID_P12_BASE64" | base64 --decode > "$DEVID_P12"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          NOTARIZE=1 make dmg
          rm -f "$DEVID_P12" "$NOTARY_KEY"

      - name: Verify the stamped version matches the tag
        run: |
          stamped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                    build/NetworkMonitor.app/Contents/Info.plist)
          if [ "$stamped" != "${{ steps.version.outputs.value }}" ]; then
            echo "tag says ${{ steps.version.outputs.value }}, bundle says $stamped" >&2
            exit 1
          fi
          echo "both say $stamped"
          lipo -archs build/NetworkMonitor.app/Contents/MacOS/NetworkMonitor

      # The app installs its own helper from Settings, so a bundle without one —
      # or with a one-architecture one — would leave Intel or Apple silicon users
      # with a hotspot feature that silently covers less.
      - name: Verify the helper is inside, for both architectures
        run: |
          helper=build/NetworkMonitor.app/Contents/Library/LaunchServices/com.kevinabouhanna.NetworkMonitor.helper
          archs=$(lipo -archs "$helper")
          echo "helper: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) exit 1 ;; esac
          test -x build/NetworkMonitor.app/Contents/Resources/helper-setup.sh
          codesign --verify --deep --strict build/NetworkMonitor.app

      # What a downloader's Mac will check: the Developer ID, the Location
      # entitlement Wi-Fi names need under the hardened runtime, and Apple's
      # notarization stapled to both the app and the disk image.
      - name: Verify the signature and notarization
        run: |
          codesign -dvv build/NetworkMonitor.app 2>&1 | tee /dev/stderr | grep -q 'TeamIdentifier=GRQKG7M8CL'
          codesign -d --entitlements - build/NetworkMonitor.app 2>&1 | grep -q 'personal-information.location'
          spctl -a -vv build/NetworkMonitor.app 2>&1 | tee /dev/stderr \
            | grep -q 'source=Notarized Developer ID'
          spctl -a -t open --context context:primary-signature -vv build/NetworkMonitor.dmg 2>&1 \
            | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          xcrun stapler validate build/NetworkMonitor.app
          xcrun stapler validate build/NetworkMonitor.dmg

      # Plain steps, no Terminal, and no Open Anyway: the release is signed
      # with the Developer ID and notarized (#119).
      - name: Write the release notes preamble
        run: |
          cat > release-notes.md <<'NOTE'
          ### Installing

          Download **NetworkMonitor.dmg** below, open it, drag NetworkMonitor into
          **Applications**, and open it from there.

          ### Updating

          Download the disk image and drag NetworkMonitor into Applications again,
          choosing **Replace**. Your settings and usage history stay. If you use
          *Stop apps updating on hotspots* and this version needs a newer helper, it
          asks for your password once, the first time it opens.

          Updating from 1.13 or earlier, macOS asks for Location once more: the app
          is now signed with an Apple Developer ID instead of its own certificate,
          so macOS sees it as new this one time.

          ---
          NOTE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             build/NetworkMonitor.dmg \
             --title "$GITHUB_REF_NAME" \
             --notes-file release-notes.md \
             --generate-notes
