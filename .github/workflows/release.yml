name: Release

# Cut a release by tagging:  git tag v1.1.0 && git push origin v1.1.0
#
# A beta (#585) is a tag vX.Y.Z-beta.N: published as a prerelease, never the
# "latest" release the app's feed reads, and offered only to copies with Get
# beta versions on, through the beta feed (the standing `beta-updates`
# prerelease's appcast.xml). Every release writes its appcast there too, so
# beta users always get the newest of either. Promoting a beta to everyone is
# tagging vX.Y.Z on the beta's commit: its build number is higher than the
# beta's (Scripts/build-number.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # required to create the release and upload the disk image

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Not shallow: bundle.sh derives the build number from the commit
          # count, and the default depth-1 clone would make every release
          # build number 1 — which is exactly the value an updater uses to
          # decide whether a new version exists.
          fetch-depth: 0

      - name: Derive the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then beta=false
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then beta=true
          else
            echo "$GITHUB_REF_NAME is neither a release (vX.Y.Z) nor a beta (vX.Y.Z-beta.N)" >&2
            exit 1
          fi
          # A beta's build sits below its commit's release (Scripts/build-number.sh):
          # on a commit that already has one, it would never be offered.
          if [ "$beta" = true ] && git tag --points-at HEAD --list 'v[0-9]*' | grep -qv -- '-beta\.'; then
            echo "this commit is already released: a beta goes on a later one" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # A beta's What's new is its release's, written before the first beta.
          echo "notes=${version%-beta.*}" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      # The version's What's new is written before tagging (#152): it's what
      # the update window shows and what the release's notes say. Checked
      # first, so a missing one fails in seconds rather than after the build.
      - name: Check the release notes are written
        run: |
          notes="ReleaseNotes/${{ steps.version.outputs.notes }}.md"
          test -s "$notes" || { echo "$notes is missing: write the What's new before tagging" >&2; exit 1; }
          # Each language's copy too (#640): ReleaseNotes/<code>/X.Y.Z.md.
          for folder in ReleaseNotes/*/; do
            [ -d "$folder" ] || continue
            copy="${folder}${{ steps.version.outputs.notes }}.md"
            test -s "$copy" || { echo "$copy is missing: write the What's new in $(basename "$folder") too" >&2; exit 1; }
          done

      # A tagged commit that fails its tests should not become a release.
      - name: Test
        run: make test

      # Universal, unlike CI's native build: a release has to run on Intel too.
      # `make dmg` builds the universal app, with its privileged helper inside,
      # also universal, and packages it as the drag-to-Applications disk image
      # the website's Download buttons point at.
      #
      # Signed with the Developer ID and notarized (#119): the app first, so
      # it's stapled before it's packaged, then the disk image. Either one opens
      # without a warning, even offline. A release without them would ask for
      # Open Anyway again, so a missing secret fails the build rather than
      # shipping that.
      - name: Build, sign, notarize and package
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.value }}
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          for name in DEVID_P12_BASE64 DEVID_P12_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER; do
            test -n "${!name}" || { echo "$name is not set" >&2; exit 1; }
          done
          export DEVID_P12="$RUNNER_TEMP/developer-id.p12" NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$DEVID_P12_BASE64" | base64 --decode > "$DEVID_P12"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          NOTARIZE=1 make dmg
          rm -f "$DEVID_P12" "$NOTARY_KEY"

      - name: Verify the stamped version matches the tag
        run: |
          stamped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                    build/NetworkMonitor.app/Contents/Info.plist)
          if [ "$stamped" != "${{ steps.version.outputs.value }}" ]; then
            echo "tag says ${{ steps.version.outputs.value }}, bundle says $stamped" >&2
            exit 1
          fi
          echo "both say $stamped"
          lipo -archs build/NetworkMonitor.app/Contents/MacOS/NetworkMonitor

      # The app installs its own helper from Settings, so a bundle without one —
      # or with a one-architecture one — would leave Intel or Apple silicon users
      # with a hotspot feature that silently covers less.
      - name: Verify the helper is inside, for both architectures
        run: |
          helper=build/NetworkMonitor.app/Contents/Library/LaunchServices/com.kevinabouhanna.NetworkMonitor.helper
          archs=$(lipo -archs "$helper")
          echo "helper: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) exit 1 ;; esac
          test -x build/NetworkMonitor.app/Contents/Resources/helper-setup.sh
          codesign --verify --deep --strict build/NetworkMonitor.app

      # The content filter (#128) goes in only with its provisioning profiles.
      # A release without it would quietly lose website names and blocking, so
      # its absence fails the build. The country and owner tables live inside
      # it, and the app links to them there.
      - name: Verify the content filter is inside, for both architectures
        run: |
          filter=build/NetworkMonitor.app/Contents/Library/SystemExtensions/com.kevinabouhanna.NetworkMonitor.Filter.systemextension
          archs=$(lipo -archs "$filter/Contents/MacOS/com.kevinabouhanna.NetworkMonitor.Filter")
          echo "filter: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) exit 1 ;; esac
          test -f "$filter/Contents/embedded.provisionprofile"
          test -f "$filter/Contents/Resources/Geo/owners.bin"
          test -f "$filter/Contents/Resources/Geo/countries.bin"
          test -f "$filter/Contents/Resources/Geo/MONTH"   # #209
          test -L build/NetworkMonitor.app/Contents/Resources/Geo/owners.bin

      # What a downloader's Mac will check: the Developer ID, the Location
      # entitlement Wi-Fi names need under the hardened runtime, and Apple's
      # notarization stapled to both the app and the disk image.
      - name: Verify the signature and notarization
        run: |
          codesign -dvv build/NetworkMonitor.app 2>&1 | tee /dev/stderr | grep -q 'TeamIdentifier=GRQKG7M8CL'
          codesign -d --entitlements - build/NetworkMonitor.app 2>&1 | grep -q 'personal-information.location'
          spctl -a -vv build/NetworkMonitor.app 2>&1 | tee /dev/stderr \
            | grep -q 'source=Notarized Developer ID'
          spctl -a -t open --context context:primary-signature -vv build/NetworkMonitor.dmg 2>&1 \
            | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          xcrun stapler validate build/NetworkMonitor.app
          xcrun stapler validate build/NetworkMonitor.dmg

      # Updating itself (#132): the disk image signed with the key whose public
      # half is in the app, and the appcast Sparkle reads, published with the
      # release so the app's feed, releases/latest/download/appcast.xml, is
      # always the newest one's. The script refuses a key the app doesn't trust.
      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          test -n "$SPARKLE_ED_KEY" || { echo "SPARKLE_ED_KEY is not set" >&2; exit 1; }
          ./Scripts/appcast.sh build/NetworkMonitor.dmg build/NetworkMonitor.app \
            "${{ steps.version.outputs.value }}" > build/appcast.xml
          cat build/appcast.xml

      # Plain steps, no Terminal, and no Open Anyway: the release is signed
      # with the Developer ID and notarized (#119).
      - name: Write the release notes
        run: |
          if [ "${{ steps.version.outputs.beta }}" = true ]; then
            cat > release-notes.md <<'NOTE'
          ### A beta

          This version comes to copies of NetworkMonitor with **Get beta versions** on, in
          Settings, before everyone else gets it. It may have problems: please
          [report what you find](https://github.com/kevinabouhanna/NetworkMonitor/issues/new?labels=beta).

          NOTE
          else
            : > release-notes.md
          fi
          cat >> release-notes.md <<'NOTE'
          ### Installing

          Download **NetworkMonitor.dmg** below, open it, drag NetworkMonitor into
          **Applications**, and open it from there.

          ### Updating

          From 1.15 on, NetworkMonitor offers each new version itself: **Check for
          Updates…** in its menu, or once a day on its own. Before that, download
          the disk image and drag NetworkMonitor into Applications again, choosing
          **Replace**. Your settings and usage history stay.

          Updating from 1.13 or earlier, macOS asks for Location once more: the app
          is now signed with an Apple Developer ID instead of its own certificate,
          so macOS sees it as new this one time.

          ---
          NOTE
          { echo; echo "### What's new in ${{ steps.version.outputs.value }}"; echo
            cat "ReleaseNotes/${{ steps.version.outputs.notes }}.md"; echo; } >> release-notes.md
          # Then each language's copy, under the language's own name (#640).
          for folder in ReleaseNotes/*/; do
            [ -d "$folder" ] || continue
            code="$(basename "$folder")"
            name="$(python3 -c 'import json, sys; print(json.load(open(".product-kit.json"))["languages"][sys.argv[1]]["name"])' "$code")"
            { echo "### ${name}"; echo
              cat "${folder}${{ steps.version.outputs.notes }}.md"; echo; } >> release-notes.md
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A beta is a prerelease, never "latest": the app's feed,
          # releases/latest/download/appcast.xml, never sees it.
          extra=()
          if [ "${{ steps.version.outputs.beta }}" = true ]; then
            extra=(--prerelease --latest=false)
          else
            # What's changed since the last release, not since its own beta on
            # the same commit.
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-beta\.' | grep -vx "$GITHUB_REF_NAME" | head -1)
            [ -z "$last" ] || extra=(--notes-start-tag "$last")
          fi
          gh release create "$GITHUB_REF_NAME" \
             build/NetworkMonitor.dmg build/appcast.xml \
             --title "$GITHUB_REF_NAME" \
             --notes-file release-notes.md \
             --generate-notes "${extra[@]}"

      # The beta feed (#585): what a copy with Get beta versions on reads.
      # Every release and every beta replaces it, so it holds the newest of
      # either; made the first time, as the data's releases are.
      - name: Update the beta feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Its tag on the first commit, so it's never the nearest tag a
          # version is read from.
          if ! gh release view beta-updates >/dev/null 2>&1; then
            gh release create beta-updates --title "Beta updates" --prerelease --latest=false \
              --target "$(git rev-list --max-parents=0 HEAD | tail -1)" \
              --notes "What NetworkMonitor reads with Get beta versions on: the newest beta or release. Not a version to download."
          fi
          # Only ever newer: two tags' runs may finish in either order.
          build() { python3 -I -c 'import re, sys; m = re.search(r"<sparkle:version>([0-9.]+)<", open(sys.argv[1]).read()); print(m.group(1) if m else "0")' "$1"; }
          current=build/beta-feed-current.xml
          gh release download beta-updates --pattern appcast.xml --output "$current" --clobber 2>/dev/null || echo '' > "$current"
          new_build=$(build build/appcast.xml); old_build=$(build "$current")
          if python3 -I -c 'import sys; v = lambda s: tuple(int(p) for p in s.split(".")); sys.exit(0 if v(sys.argv[1]) > v(sys.argv[2]) else 1)' "$new_build" "$old_build"; then
            gh release upload beta-updates build/appcast.xml --clobber
          else
            echo "the beta feed already has build $old_build, newer than $new_build: left as it is"
          fi
