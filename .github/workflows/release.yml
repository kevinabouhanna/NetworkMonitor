name: Release

# Cut a release by tagging:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # required to create the release and upload the zip

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Not shallow: bundle.sh derives the build number from the commit
          # count, and the default depth-1 clone would make every release
          # build number 1 — which is exactly the value an updater uses to
          # decide whether a new version exists.
          fetch-depth: 0

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tagged commit that fails its tests should not become a release.
      - name: Test
        run: make test

      # Universal, unlike CI's native build: a release has to run on Intel too.
      - name: Build the universal app
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.value }}
        run: make universal

      - name: Verify the stamped version matches the tag
        run: |
          stamped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                    build/NetworkMonitor.app/Contents/Info.plist)
          if [ "$stamped" != "${{ steps.version.outputs.value }}" ]; then
            echo "tag says ${{ steps.version.outputs.value }}, bundle says $stamped" >&2
            exit 1
          fi
          echo "both say $stamped"
          lipo -archs build/NetworkMonitor.app/Contents/MacOS/NetworkMonitor

      # ditto, not zip: it preserves the bundle's symlinks and extended
      # attributes, so the signature survives the round trip. This is also the
      # archive format Sparkle expects when it is added.
      - name: Package
        run: |
          ditto -c -k --keepParent build/NetworkMonitor.app \
                "NetworkMonitor-${{ steps.version.outputs.value }}.zip"

      # GitHub puts the zip in the repo sidebar where it reads as the obvious
      # download, but an ad-hoc signed app is quarantined once it has been
      # zipped and shared — macOS refuses to open it and sends the user into
      # System Settings. Until the Developer ID lands, the zip is a build
      # artifact and the note below says so, so nobody bounces off a warning
      # dialog thinking the app is broken. Drop this once builds are notarized.
      - name: Write the release notes preamble
        run: |
          cat > release-notes.md <<'NOTE'
          > [!IMPORTANT]
          > **This download is not yet signed with an Apple Developer ID**, so
          > macOS will refuse to open it and say the developer cannot be
          > verified. That is Gatekeeper doing its job, not a broken build.

          ### Installing

          Build from source — a locally built app is never quarantined, so this
          path has no warnings at all:

          ```sh
          git clone https://github.com/kevinabouhanna/NetworkMonitor.git
          cd NetworkMonitor
          ./Scripts/install.sh
          ```

          Update later with `make update`.

          If you would rather use the zip and know what you are doing, clear the
          quarantine flag yourself after unzipping:

          ```sh
          xattr -dr com.apple.quarantine NetworkMonitor.app
          ```

          Signed and notarized downloads that open with a double-click are
          planned.

          ---
          NOTE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             "NetworkMonitor-${{ steps.version.outputs.value }}.zip" \
             --title "$GITHUB_REF_NAME" \
             --notes-file release-notes.md \
             --generate-notes
